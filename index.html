        <h1>Git Visualizer — Interactive Git Learning Platform</h1>
        <p>A deterministic Git repository simulator, live commit DAG visualizer, guided curriculum, safe undo laboratory, and architecture flowchart by <a href="https://www.dipeshsapkota7.com.np/" rel="author">Dipesh Sapkota</a>.</p>
        <p>Main Portfolio & Projects: <a href="https://www.dipeshsapkota7.com.np/" rel="home">https://www.dipeshsapkota7.com.np/</a></p>
        
        <h2>Core Modules</h2>
        <ul>
          <li><strong>Interactive Sandbox:</strong> Live commit graph, simulated CLI terminal, repository state inspector (working tree, index, branches, stash, remotes), before-and-after explanation panel, and time-travel timeline.</li>
          <li><strong>Guided Lessons & Challenges:</strong> 12 step-by-step lessons from repository initialization to merge conflict resolution and reflog recovery, plus target-state challenges.</li>
          <li><strong>Safe Undo Lab:</strong> Detailed comparative matrix for <code>git restore</code>, <code>git reset (--soft/mixed/hard)</code>, <code>git revert</code>, and <code>git reflog</code> with safety warnings.</li>
          <li><strong>5-Stage Architecture Flowchart:</strong> Trace code movement across Stash, Workspace, Staging Area, Local Repository, and Remote Repository.</li>
          <li><strong>Command Reference:</strong> Searchable guide covering syntax, preconditions, expected effects, and error handling.</li>
        </ul>

        <h2>Supported Commands</h2>
        <p>git init, git status, git add, git commit, git log, git diff, git branch, git switch, git checkout, git merge, git rebase, git stash, git stash pop, git fetch, git pull, git push, git clone, git remote, git tag, git show, git restore, git reset, git revert, git cherry-pick, git reflog.</p>
